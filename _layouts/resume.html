<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} · Resume</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2.1.1/out/water.min.css">
  <style>
    /* Start the summary below the floated avatar */
    blockquote { clear: both; }

    @page { margin: 1.5cm; }

    @media print {
      :root {
        --background-body: #fff;
        --background: #fff;
        --text-main: #000;
        --text-bright: #000;
        --links: #000;
        --border: #ccc;
      }
      body { max-width: none; margin: 0; padding: 0; font-size: 11pt; }

      /* Keep headings and job dates with the content that follows */
      h1, h2, h3, h3 + p { break-after: avoid; }
      li, blockquote, img { break-inside: avoid; }

      /* Collapsed tech lists stay out of the PDF */
      details { display: none; }

      /* Optional manual break: <div class="page-break"></div> */
      .page-break { break-before: page; }
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
